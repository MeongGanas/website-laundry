<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Gradient Background (Laundry Royal Blue) -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Washing Machine Body with Subtle Elevation -->
  <g filter="url(#glow)">
    <rect x="13" y="11" width="38" height="42" rx="7" fill="#ffffff" />
  </g>

  <!-- Top Dashboard Bar -->
  <rect x="13" y="11" width="38" height="10" rx="7" fill="#f8fafc" />
  <rect x="13" y="18" width="38" height="3" fill="#f8fafc" />
  
  <!-- Dashboard Buttons / Dial -->
  <circle cx="20" cy="16" r="2.2" fill="#2563eb" />
  <circle cx="26" cy="16" r="1.5" fill="#94a3b8" />
  <circle cx="31" cy="16" r="1.5" fill="#94a3b8" />
  <rect x="39" y="14" width="7" height="4" rx="1.5" fill="#cbd5e1" />

  <!-- Outer Drum Ring -->
  <circle cx="32" cy="35" r="13" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2" />

  <!-- Inner Drum Glass (Blue Accent) -->
  <circle cx="32" cy="35" r="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />

  <!-- Washing Water Wave -->
  <path d="M22.5 35 C 25.5 33, 28.5 37, 32 35 C 35.5 33, 38.5 37, 41.5 35 C 41.5 40.2, 37.2 44.5, 32 44.5 C 26.8 44.5, 22.5 40.2, 22.5 35 Z" fill="url(#waterGrad)" opacity="0.9" />

  <!-- Clean Bubbles Inside -->
  <circle cx="30" cy="31" r="2.2" fill="#ffffff" opacity="0.9" />
  <circle cx="35" cy="29" r="1.4" fill="#ffffff" opacity="0.8" />
  <circle cx="27" cy="37" r="1.2" fill="#ffffff" opacity="0.8" />

  <!-- Fresh Golden Sparkle (Top Right) -->
  <path d="M51 6 L52.8 11.2 L58 13 L52.8 14.8 L51 20 L49.2 14.8 L44 13 L49.2 11.2 Z" fill="#facc15" />

  <!-- Fresh Cyan Sparkle (Bottom Left) -->
  <path d="M11 29 L12.2 32.8 L16 34 L12.2 35.2 L11 39 L9.8 35.2 L6 34 L9.8 32.8 Z" fill="#38bdf8" />
</svg>